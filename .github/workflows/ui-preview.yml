name: UI Preview Screenshots

# Developer preview only: boots the app in an iOS Simulator in CI and captures
# screenshots of the second-level category screen. The Windows dev box has no
# Xcode, so this is the only way to see the real rendered UI.
on:
  push:
    branches:
      - main
      - redesign/category-ui
    paths:
      - 'ios/**'
      - '.github/workflows/ui-preview.yml'
  workflow_dispatch:

concurrency:
  group: ui-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Show available simulator runtimes
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available | head -60

      - name: Boot newest iOS simulator
        id: sim
        run: |
          # Always pick the highest available iOS runtime (e.g. iOS 26.x with
          # Xcode 26.3), not whatever device `simctl` happens to list first —
          # the first entry was iOS 18.5, which cannot render the Liquid Glass
          # tab bar users see on their own devices.
          SELECTION="$(/usr/bin/python3 - <<'PY'
          import json
          import re
          import subprocess

          runtimes = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"])
          )["runtimes"]

          def version_key(runtime):
              match = re.match(r"(\d+)(?:\.(\d+))?", runtime.get("version", "0"))
              return (int(match.group(1)), int(match.group(2) or 0)) if match else (0, 0)

          ios = sorted(
              [r for r in runtimes if r.get("isAvailable") and r.get("platform") == "iOS"],
              key=version_key,
              reverse=True,
          )
          if not ios:
              raise SystemExit("no available iOS runtime")
          runtime = ios[0]
          devices = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devices", "-j"])
          )["devices"].get(runtime["identifier"], [])
          phones = [
              d for d in devices
              if d.get("isAvailable") and "iPhone" in d["name"]
          ]
          if not phones:
              raise SystemExit("no available iPhone in newest iOS runtime")
          pros = [d for d in phones if "Pro" in d["name"]]
          device = (pros or phones)[0]
          print(f"{device['udid']}\t{runtime['version']}\t{device['name']}")
          PY
          )"
          IFS=$'\t' read -r DEVICE_ID IOS_VERSION DEVICE_NAME <<< "$SELECTION"
          echo "selected iOS $IOS_VERSION — $DEVICE_NAME ($DEVICE_ID)"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "ios_version=$IOS_VERSION" >> "$GITHUB_OUTPUT"
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

      - name: Run UI test and capture screenshots
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project WnacgDownloader.xcodeproj \
            -scheme WnacgDownloader \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee ui-test.log

      - name: Collect screenshots
        if: always()
        working-directory: ios
        run: |
          mkdir -p screenshots
          find "$HOME/Library/Developer/CoreSimulator/Devices" -name 'ui-*.png' \
            -exec cp {} screenshots/ \; 2>/dev/null || true
          ls -la screenshots || true

      - name: Collect app logs
        if: always()
        working-directory: ios
        run: |
          xcrun simctl spawn "${{ steps.sim.outputs.device_id }}" \
            log show --last 15m --style compact \
            --predicate 'process == "WnacgDownloader"' \
            > app.log 2>/dev/null || true
          grep -E 'CategoryFeed|HTTP|error|Error|429' app.log \
            | tail -200 || true

      - name: Upload app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: ios/app.log
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ios/screenshots
          if-no-files-found: warn

      - name: Upload test log and result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-failure
          path: |
            ios/ui-test.log
            ios/TestResults.xcresult
          if-no-files-found: ignore
