name: UI Preview Screenshots

# Developer preview only: boots the app in an iOS Simulator in CI and captures
# screenshots of the second-level category screen. The Windows dev box has no
# Xcode, so this is the only way to see the real rendered UI.
on:
  push:
    branches:
      - redesign/category-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Boot simulator
        id: sim
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | /usr/bin/python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for runtime in data["devices"].values() for d in runtime if "iPhone" in d["name"]]
          print(devices[0]["udid"] if devices else "")')"
          if [ -z "$DEVICE_ID" ]; then
            echo "no iPhone simulator found" >&2
            exit 1
          fi
          echo "device=$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "device_name=$(xcrun simctl list devices available | grep "$DEVICE_ID" | sed 's/ *(.*//' | xargs)" >> "$GITHUB_OUTPUT"

      - name: Run UI test and capture screenshots
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project WnacgDownloader.xcodeproj \
            -scheme WnacgDownloader \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee ui-test.log

      - name: Collect screenshots
        if: always()
        working-directory: ios
        run: |
          mkdir -p screenshots
          find "$HOME/Library/Developer/CoreSimulator/Devices" -name 'ui-*.png' \
            -exec cp {} screenshots/ \; 2>/dev/null || true
          ls -la screenshots || true

      - name: Collect app logs
        if: always()
        working-directory: ios
        run: |
          xcrun simctl spawn "${{ steps.sim.outputs.device_id }}" \
            log show --last 15m --style compact \
            --predicate 'process == "WnacgDownloader"' \
            > app.log 2>/dev/null || true
          grep -E 'CategoryFeed|HTTP|error|Error|429' app.log \
            | tail -200 || true

      - name: Upload app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: ios/app.log
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ios/screenshots
          if-no-files-found: warn

      - name: Upload test log and result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-failure
          path: |
            ios/ui-test.log
            ios/TestResults.xcresult
          if-no-files-found: ignore
