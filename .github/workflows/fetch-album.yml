name: Fetch Wnacg Album

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download album page
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          curl -sSL --retry 3 --retry-delay 2 --max-time 90 -A "$UA" "https://www.wnacg.com/photos-index-aid-383877.html" -o album.html
          ls -lh album.html
          grep -o 'search/index.php[^"]*' album.html | head -20
          grep -o 'tags[^"]*' album.html | head -20
          grep -o 'tag[^"]*' album.html | head -20
      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: wnacg-album-html
          path: album.html
          retention-days: 1
