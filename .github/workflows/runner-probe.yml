name: Runner Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ubuntu ok"

  macos15:
    runs-on: macos-15
    steps:
      - run: sw_vers && xcodebuild -version

  macos15intel:
    runs-on: macos-15-intel
    steps:
      - run: uname -m && sw_vers && xcodebuild -version

  macos26:
    runs-on: macos-26
    steps:
      - run: sw_vers && xcodebuild -version
