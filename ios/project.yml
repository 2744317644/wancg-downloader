name: WnacgDownloader
options:
  bundleIdPrefix: com.wancg
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  WnacgDownloader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: ZIPFoundation
      - sdk: PDFKit.framework
      - sdk: ActivityKit.framework
      - target: WnacgWidgets
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: wnacg
        CFBundleShortVersionString: "1.20.2"
        CFBundleVersion: "251"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        CADisableMinimumFrameDurationOnPhone: true
        NSLocalNetworkUsageDescription: 用于连接本机的下载代理。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wancg.downloader
        MARKETING_VERSION: "1.20.2"
        CURRENT_PROJECT_VERSION: "251"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO

  WnacgWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
      - path: Sources/DownloadActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: wnacg 下载
        CFBundleShortVersionString: "1.20.2"
        CFBundleVersion: "251"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wancg.downloader.widgets
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
        ENABLE_BITCODE: NO

  WnacgProxyCheck:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/LocalProxy.swift
      - path: Sources/DoHResolver.swift
      - path: Sources/WnacgClient.swift
      - path: Sources/HTMLParser.swift
      - path: Sources/HomeParser.swift
      - path: Sources/Models.swift
      - path: Sources/DownloadFolders.swift
      - path: Sources/ZipExtractor.swift
      - path: TestMain.swift
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wancg.proxycheck
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: NO

schemes:
  WnacgDownloader:
    build:
      targets:
        WnacgDownloader: all
    run:
      config: Debug
    archive:
      config: Release
  WnacgProxyCheck:
    build:
      targets:
        WnacgProxyCheck: all
    run:
      config: Debug
